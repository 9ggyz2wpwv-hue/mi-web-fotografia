name: Deploy Panenka landing to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/eager-turing-unsjai
    paths:
      - "panenka/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: panenka

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
